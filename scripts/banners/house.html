CHROMIUM="$HOME/Library/Caches/ms-playwright/chromium_headless_shell-1255/chrome-headless-shell-mac-arm64/chrome-headless-shell"
"$CHROMIUM" --no-sandbox --force-device-scale-factor=1 --force-color-profile=srgb \
  --window-size=1940,180 --screenshot=/tmp/kwip-house-source.png "file://$PWD/scripts/banners/house.html"
