name: Feed refresh

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: feed-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: feed-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '10.11.0'
      - name: Install publisher dependency
        run: pnpm --dir scripts --ignore-workspace install --frozen-lockfile
      - name: Publish feed
        shell: bash
        timeout-minutes: 5
        env:
          NUXT_PUBLIC_FEED_BASE: https://api.ppv.st/api
          R2_BUCKET: kwip-feed-prod
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          status=0
          output=$(pnpm publish:feed --bucket kwip-feed-prod) || status=$?
          printf '%s\n' "$output"
          {
            printf '%s\n' '```json'
            printf '%s\n' "$output" | sed -n '/^{.*}$/p'
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
